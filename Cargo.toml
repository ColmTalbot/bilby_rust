[package]
name = "bilby_rust"
version = "0.1.1"
authors = ["Colm Talbot <talbotcolm@gmail.com>"]
edition = "2021"
description = "Rust implementation of domain-specific geometrical operations for Bilby to mirror the functionality in bilby-cython using PyO3."
readme = "README.md"
repository = "https://github.com/ColmTalbot/bilby_rust"
license = "MIT"
categories = ["science", "date-and-time"]
exclude = ["examples/demonstration.ipynb", ".github/", ".gitignore", ".cargo_vcs_info.json"]

[dependencies]
chrono = "0.4"
numpy = { version = "0.30", optional = true }
pyo3 = { version = "0.30", optional = true }
num-complex = "0.4"

[features]
default = []
# Build the Python bindings.
python = ["dep:pyo3", "dep:numpy", "pyo3/abi3-py310", "pyo3/abi3t-py315", "pyo3/chrono", "pyo3/num-complex"]
# Used by maturin when building the Python extension module.
extension-module = ["python", "pyo3/extension-module"]

[lib]
name = "bilby_rust"
crate-type = ["cdylib", "rlib"]
